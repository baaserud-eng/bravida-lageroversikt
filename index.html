<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bravida Lager – Kontorsjef</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#12192B;
    --paper:#EDEFEE;
    --card:#FFFFFF;
    --accent:#F0A202;
    --accent-ink:#4A3300;
    --danger:#C1272D;
    --danger-bg:#FBEAEA;
    --line:#D4D7D2;
    --muted:#5B6169;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  #app{min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    background:var(--ink); color:#fff;
    padding:14px 18px; display:flex; align-items:baseline; gap:8px;
    position:sticky; top:0; z-index:20;
  }
  .topbar .mark{ width:10px; height:10px; background:var(--accent); display:inline-block; border-radius:1px; }
  .topbar .word{font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; letter-spacing:0.02em;}
  .topbar .sub{font-size:12px; color:#B9BFCC; font-family:'IBM Plex Mono',monospace;}

  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 60px; width:100%; flex:1;}

  .center-note{max-width:420px; margin:60px auto; text-align:center; color:var(--muted);}
  .spinner{width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .gatecard{max-width:340px; margin:70px auto; background:var(--card); border:1.5px solid var(--line); padding:30px; text-align:center; border-radius:2px;}
  .gatecard h2{font-size:24px; margin-bottom:6px;}
  .gatecard p{color:var(--muted); font-size:14px; margin:0 0 18px;}
  .pininput{
    width:100%; padding:13px; font-size:20px; text-align:center; border:1.5px solid var(--line);
    border-radius:3px; margin-bottom:12px; font-family:'IBM Plex Mono',monospace;
  }
  .nameinput{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:3px; font-size:16px; margin-bottom:12px;
  }
  .errmsg{color:var(--danger); font-size:13px; margin-bottom:10px;}
  .primarybtn{
    width:100%; padding:15px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:3px;
    font-size:16px; font-weight:600; cursor:pointer;
  }
  .primarybtn:disabled{opacity:0.5; cursor:not-allowed;}
  .secondarybtn{ padding:10px 16px; background:none; border:1.5px solid var(--line); border-radius:3px; cursor:pointer; font-size:14px; }
  .dangerbtn{ padding:8px 14px; background:none; border:1.5px solid var(--danger); color:var(--danger); border-radius:3px; cursor:pointer; font-size:13px; }
  .ghostbtn{background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; padding:4px 0;}

  .noteband{background:#FFF6E5; border:1px solid #E8C77A; color:#5A4200; padding:10px 14px; border-radius:3px; font-size:13px; margin-bottom:18px;}

  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:#1E7A34; color:#fff; padding:12px 22px; border-radius:4px;
    font-size:14px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:50; animation:toastIn 0.25s ease;
  }
  .toast.danger{ background:var(--danger); }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }
  @media (prefers-reduced-motion: reduce){ .toast{animation:none;} }

  .adminshell{display:flex; min-height:calc(100vh - 60px);}
  .adminnav{ background:var(--ink); color:#fff; width:180px; flex-shrink:0; padding:20px 0; }
  .adminnav button{
    display:block; width:100%; text-align:left; background:none; border:none; color:#C9CDD6;
    padding:12px 20px; font-size:14.5px; cursor:pointer; border-left:3px solid transparent;
  }
  .adminnav button.active{color:#fff; border-left-color:var(--accent); background:rgba(255,255,255,0.04);}
  .navbadge{
    display:inline-block; margin-left:6px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px; vertical-align:middle;
  }
  .adminmain{flex:1; padding:26px; max-width:920px;}
  @media (max-width:720px){
    .adminshell{flex-direction:column;}
    .adminnav{width:100%; display:flex; overflow-x:auto; padding:0;}
    .adminnav button{white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:14px 16px;}
    .adminnav button.active{border-left:none; border-bottom-color:var(--accent);}
  }

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{text-align:left; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:600; padding:8px 10px; border-bottom:1.5px solid var(--ink);}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr.lowrow{background:var(--danger-bg);}
  .rowbtns{display:flex; gap:6px;}
  .smallbtn{padding:5px 10px; font-size:12.5px; border:1px solid var(--line); background:var(--card); border-radius:3px; cursor:pointer;}

  .adminmain h1{font-size:26px; margin-bottom:18px;}
  .formgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:480px;}
  .formfield label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px;}
  .formfield input, .formfield select{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:3px; font-size:15px;}
  .savebar{margin-top:18px;}

  .qrgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px;}
  .qrcard{background:var(--card); border:1.5px solid var(--line); padding:16px; text-align:center; border-radius:2px;}
  .qrcard .name{font-weight:600; margin:10px 0 2px;}
  .qrcard .cat{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .qrbox{display:flex; justify-content:center; align-items:center; min-height:150px;}
  .qrplaceholder{width:150px; height:150px; border:1.5px dashed var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; padding:10px; text-align:center;}

  .inlineedit{background:var(--paper); border:1px solid var(--line); padding:14px; margin-top:6px; border-radius:3px;}
  .confirmrow{display:flex; align-items:center; gap:10px; font-size:13.5px; flex-wrap:wrap;}

  .notiflist{display:flex; flex-direction:column; border-top:1px solid var(--line);}
  .notifrow{padding:13px 14px; border-bottom:1px solid var(--line); font-size:14px;}
  .notifrow.unseen{background:var(--danger-bg);}
  .notifmeta{font-size:12px; color:var(--muted); margin-top:3px;}
  .unseenTag{color:var(--danger); font-weight:700;}

  @media print{
    .topbar, .adminnav, .noprint{display:none !important;}
    .adminmain{padding:0; max-width:none;}
    body{background:#fff;}
    .qrgrid{grid-template-columns:repeat(3,1fr);}
    .qrcard{break-inside:avoid; border:1px dashed #999;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ storage helpers (Firebase Firestore - shared, real database) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA1is42oivHBlDrrUapyZwrztCUq0HwpC8",
  authDomain: "bravida-lager.firebaseapp.com",
  projectId: "bravida-lager",
  storageBucket: "bravida-lager.firebasestorage.app",
  messagingSenderId: "358302083961",
  appId: "1:358302083961:web:ab58c6e58c9a14ab611da8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FIREBASE_COLLECTION = 'bravida-lager';

async function storageGet(key, shared){
  try{
    const snap = await db.collection(FIREBASE_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return (data && Object.prototype.hasOwnProperty.call(data, 'value')) ? data.value : null;
  }catch(e){ console.error('storage get failed', key, e); return null; }
}
async function storageSet(key, value, shared){
  try{
    await db.collection(FIREBASE_COLLECTION).doc(key).set({ value });
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

/* ============ state ============ */
const CATEGORIES = ['Elektro','Brannsikkerhet','Ventilasjon','Adgangskontroll','Innbruddsalarm','Kameraovervåkning','Nødlys','Annet'];
const UNITS = ['stk','meter','pakke','liter'];

let state = {
  loaded:false,
  items:[],
  logs:[],
  notifications:[],
  settings:null, // null = kontorsjef-tilgang er ikke satt opp ennå
  adminUnlocked:false,
  setupEmail:'', setupPassword:'', setupPasswordConfirm:'', setupError:'',
  loginEmail:'', loginPassword:'', loginError:'', loginFailCount:0, loginLockedUntil:0,
  showRecovery:false, recoveryCode:'', recoveryNewPassword:'', recoveryNewPasswordConfirm:'', recoveryError:'',
  justRecoveryCode:null,
  adminTab:'oversikt',
  editingId:null,
  editDraft:{},
  confirmDeleteId:null,
  confirmReset:false,
  logSearch:'',
  oversiktSearch:'',
  newItem:{ name:'', produktnummer:'', category:CATEGORIES[0], qty:0, unit:'stk', minStock:0, pris:0 },
  newItemError:'',
  acctEmail:'', acctCurrentPassword:'', acctNewPassword:'', acctNewPasswordConfirm:'', acctRegenCode:false, acctMsg:'',
  appUrlDraft:'', appUrlMsg:'',
  toastMsg:null, toastType:'success'
};
let toastTimer = null;
function showToast(msg, type){
  state.toastMsg = msg;
  state.toastType = type || 'success';
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toastMsg = null; render(); }, 2500);
}

/* ============ low-stock notifications ============ */
let lowStockState = {}; // itemId -> was it low last time we checked (in-memory, per session)
function checkLowStockNotifications(silent){
  let changed = false;
  state.items.forEach(item=>{
    const low = isLow(item);
    const wasLow = lowStockState[item.id] === true;
    if(low && !wasLow && !silent){
      state.notifications.unshift({
        id: uid(), itemId: item.id, itemName: item.name,
        qty: item.qty, minStock: item.minStock,
        ts: new Date().toISOString(), seen: false
      });
      state.notifications = state.notifications.slice(0, 200);
      changed = true;
    }
    lowStockState[item.id] = low;
  });
  if(changed){ storageSet('notifications', state.notifications, true); }
}
async function markNotificationsSeen(){
  let changed = false;
  state.notifications.forEach(n=>{ if(!n.seen){ n.seen = true; changed = true; } });
  if(changed){ await storageSet('notifications', state.notifications, true); }
}

async function sha256Hex(str){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomCode(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = '';
  for(let i=0;i<len;i++){ out += chars[arr[i] % chars.length]; }
  return out;
}
function normEmail(e){ return String(e||'').trim().toLowerCase(); }

function uid(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
}
function seedItems(){
  return [
    {id:uid(), name:'Brannalarm', produktnummer:'', category:'Brannsikkerhet', qty:24, unit:'stk', minStock:5, pris:0},
    {id:uid(), name:'Røykvarsler', produktnummer:'', category:'Brannsikkerhet', qty:40, unit:'stk', minStock:10, pris:0},
    {id:uid(), name:'Sikring 16A', produktnummer:'', category:'Elektro', qty:150, unit:'stk', minStock:20, pris:0},
    {id:uid(), name:'Kabelrør 20mm', produktnummer:'', category:'Elektro', qty:80, unit:'meter', minStock:15, pris:0},
    {id:uid(), name:'PEX-rør 20mm', produktnummer:'', category:'Annet', qty:60, unit:'meter', minStock:10, pris:0},
    {id:uid(), name:'Termostat', produktnummer:'', category:'Ventilasjon', qty:18, unit:'stk', minStock:4, pris:0}
  ];
}

async function init(){
  let items = await storageGet('items', true);
  if(!items){ items = seedItems(); await storageSet('items', items, true); }
  let logs = await storageGet('logs', true);
  if(!logs){ logs = []; await storageSet('logs', logs, true); }
  let notifications = await storageGet('notifications', true);
  if(!notifications){ notifications = []; }
  let settings = await storageGet('settings', true); // null = ikke satt opp ennå

  state.items = items; state.logs = logs; state.notifications = notifications; state.settings = settings; state.loaded = true;
  checkLowStockNotifications(true); // baseline stille - ikke varsle om ting som allerede var lavt før noen åpnet siden
  render();
  startPolling();
}

function startPolling(){
  setInterval(async ()=>{
    if(document.visibilityState !== 'visible') return;
    if(!state.adminUnlocked) return;
    if(state.editingId) return; // ikke overskriv en pågående redigering
    const items = await storageGet('items', true);
    if(items){ state.items = items; checkLowStockNotifications(); }
    const logs = await storageGet('logs', true);
    if(logs){ state.logs = logs; }
    render();
  }, 15000);

  setInterval(()=>{
    if(!state.adminUnlocked && state.settings && state.loginLockedUntil && Date.now() < state.loginLockedUntil){
      render();
    }
  }, 1000);
}

/* ============ credentials ============ */
async function submitSetup(){
  const email = normEmail(state.setupEmail);
  if(!email.includes('@') || email.length < 5){ state.setupError = 'Skriv inn en gyldig e-post.'; render(); return; }
  if(state.setupPassword.length < 6){ state.setupError = 'Passordet må være minst 6 tegn.'; render(); return; }
  if(state.setupPassword !== state.setupPasswordConfirm){ state.setupError = 'Passordene er ikke like.'; render(); return; }

  const salt = randomCode(16);
  const passwordHash = await sha256Hex(salt + state.setupPassword);
  const recoveryCode = randomCode(10);
  const recoveryHash = await sha256Hex(salt + 'recovery:' + recoveryCode);

  state.settings = { email, salt, passwordHash, recoveryHash, appUrl:'' };
  await storageSet('settings', state.settings, true);

  state.setupPassword=''; state.setupPasswordConfirm=''; state.setupError='';
  state.justRecoveryCode = recoveryCode;
  render();
}

async function submitLogin(){
  const now = Date.now();
  if(state.loginLockedUntil && now < state.loginLockedUntil){ render(); return; }
  const s = state.settings;
  const attemptHash = await sha256Hex(s.salt + state.loginPassword);
  if(normEmail(state.loginEmail) === s.email && attemptHash === s.passwordHash){
    state.adminUnlocked = true; state.loginError=''; state.loginPassword=''; state.loginFailCount=0; state.loginLockedUntil=0;
  }else{
    state.loginFailCount = (state.loginFailCount||0) + 1;
    if(state.loginFailCount >= 5){
      state.loginLockedUntil = Date.now() + 30000;
      state.loginFailCount = 0;
      state.loginError = 'For mange feilforsøk. Prøv igjen om litt.';
    }else{
      state.loginError = 'Feil e-post eller passord.';
    }
  }
  render();
}

function openForgotPassword(){ state.showRecovery = true; state.recoveryError=''; render(); }
function cancelForgotPassword(){ state.showRecovery = false; state.recoveryCode=''; state.recoveryNewPassword=''; state.recoveryNewPasswordConfirm=''; state.recoveryError=''; render(); }

async function submitRecovery(){
  const s = state.settings;
  const attemptHash = await sha256Hex(s.salt + 'recovery:' + state.recoveryCode.trim().toUpperCase());
  if(attemptHash !== s.recoveryHash){ state.recoveryError = 'Feil gjenopprettingskode.'; render(); return; }
  if(state.recoveryNewPassword.length < 6){ state.recoveryError = 'Det nye passordet må være minst 6 tegn.'; render(); return; }
  if(state.recoveryNewPassword !== state.recoveryNewPasswordConfirm){ state.recoveryError = 'Passordene er ikke like.'; render(); return; }

  const newSalt = randomCode(16);
  s.salt = newSalt;
  s.passwordHash = await sha256Hex(newSalt + state.recoveryNewPassword);
  const newRecoveryCode = randomCode(10);
  s.recoveryHash = await sha256Hex(newSalt + 'recovery:' + newRecoveryCode);
  await storageSet('settings', s, true);

  state.showRecovery=false; state.recoveryCode=''; state.recoveryNewPassword=''; state.recoveryNewPasswordConfirm=''; state.recoveryError='';
  state.justRecoveryCode = newRecoveryCode;
  render();
}

function acknowledgeRecoveryCode(){
  state.justRecoveryCode = null;
  state.adminUnlocked = true;
  render();
}

async function saveAccountSettings(){
  const s = state.settings;
  const currentHash = await sha256Hex(s.salt + state.acctCurrentPassword);
  if(currentHash !== s.passwordHash){ state.acctMsg = 'Feil nåværende passord.'; render(); return; }

  const newEmail = normEmail(state.acctEmail) || s.email;
  if(!newEmail.includes('@')){ state.acctMsg = 'E-posten ser ikke gyldig ut.'; render(); return; }
  s.email = newEmail;

  if(state.acctNewPassword){
    if(state.acctNewPassword.length < 6){ state.acctMsg = 'Nytt passord må være minst 6 tegn.'; render(); return; }
    if(state.acctNewPassword !== state.acctNewPasswordConfirm){ state.acctMsg = 'De nye passordene er ikke like.'; render(); return; }
    const newSalt = randomCode(16);
    s.salt = newSalt;
    s.passwordHash = await sha256Hex(newSalt + state.acctNewPassword);
  }

  let showNewCode = null;
  if(state.acctRegenCode){
    const code = randomCode(10);
    s.recoveryHash = await sha256Hex(s.salt + 'recovery:' + code);
    showNewCode = code;
  }

  await storageSet('settings', s, true);
  state.acctCurrentPassword=''; state.acctNewPassword=''; state.acctNewPasswordConfirm=''; state.acctRegenCode=false;
  state.acctEmail = s.email;

  if(showNewCode){
    state.acctMsg='';
    state.justRecoveryCode = showNewCode;
  }else{
    state.acctMsg = 'Lagret.';
  }
  render();
}

async function saveAppUrl(){
  state.settings.appUrl = state.appUrlDraft.trim();
  await storageSet('settings', state.settings, true);
  state.appUrlMsg = 'Lagret.';
  render();
}

/* ============ items / log ============ */
async function saveItems(){ await storageSet('items', state.items, true); }

function addItem(){
  const n = state.newItem;
  if(!n.name.trim()){ state.newItemError = 'Du må skrive et varenavn.'; render(); return; }
  state.newItemError = '';
  state.items.push({id:uid(), name:n.name.trim(), produktnummer:(n.produktnummer||'').trim(), category:n.category, qty:Math.max(0,Number(n.qty)||0), unit:n.unit, minStock:Math.max(0,Number(n.minStock)||0), pris:Math.max(0,Number(n.pris)||0)});
  state.newItem = {name:'', produktnummer:'', category:CATEGORIES[0], qty:0, unit:'stk', minStock:0, pris:0};
  checkLowStockNotifications();
  saveItems();
  showToast('Vare lagt til.');
}
function startEdit(item){ state.editingId = item.id; state.editDraft = {...item}; render(); }
function cancelEdit(){ state.editingId = null; render(); }
function saveEdit(){
  const idx = state.items.findIndex(i=>i.id===state.editingId);
  if(idx>-1){
    state.items[idx] = {...state.editDraft, qty:Math.max(0,Number(state.editDraft.qty)||0), minStock:Math.max(0,Number(state.editDraft.minStock)||0), pris:Math.max(0,Number(state.editDraft.pris)||0)};
  }
  state.editingId = null;
  checkLowStockNotifications();
  saveItems();
  showToast('Lagret.');
}
function deleteItem(id){
  state.items = state.items.filter(i=>i.id!==id);
  state.confirmDeleteId = null;
  saveItems();
  showToast('Vare slettet.', 'danger');
}
async function resetDemoData(){
  state.items = seedItems();
  state.logs = [];
  state.notifications = [];
  lowStockState = {};
  state.confirmReset = false;
  await storageSet('items', state.items, true);
  await storageSet('logs', state.logs, true);
  await storageSet('notifications', state.notifications, true);
  checkLowStockNotifications(true);
  render();
}

/* ============ helpers ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  try{ return new Date(iso).toLocaleString('nb-NO', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; }
}
function isLow(item){ return item.qty <= item.minStock; }
function fmtKr(n){
  const num = Number(n)||0;
  return num.toLocaleString('nb-NO', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' kr';
}
function shelfUrl(itemId){
  const base = (state.settings && state.settings.appUrl) ? state.settings.appUrl.trim() : '';
  return base ? (base + '#item=' + itemId) : '';
}

/* ============ Excel-eksport ============ */
function todayStamp(){ return new Date().toISOString().slice(0,10); }
function exportOversiktToExcel(){
  const rows = state.items.map(item => ({
    'Vare': item.name,
    'Produktnummer': item.produktnummer || '',
    'Kategori': item.category,
    'Antall': item.qty,
    'Enhet': item.unit,
    'Pris': item.pris || 0,
    'Min. beholdning': item.minStock,
    'Lav beholdning': isLow(item) ? 'Ja' : 'Nei'
  }));

/* ============ Excel-import ============ */
function pickField(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const found = keys.find(k => k.trim().toLowerCase() === cand.toLowerCase());
    if(found !== undefined) return row[found];
  }
  return '';
}
function importItemsFromRows(rows){
  let added = 0;
  rows.forEach(row=>{
    const name = String(pickField(row, ['Vare','Navn','Produkt','Artikkel']) || '').trim();
    if(!name) return;
    const produktnummer = String(pickField(row, ['Produktnummer','Art.nr','Artnr','Varenummer','SKU']) || '').trim();
    const category = String(pickField(row, ['Kategori','Type']) || '').trim() || 'Annet';
    const qty = Math.max(0, Number(pickField(row, ['Antall','Beholdning','Lager','Qty'])) || 0);
    const unit = String(pickField(row, ['Enhet','Unit']) || '').trim() || 'stk';
    const pris = Math.max(0, Number(pickField(row, ['Pris','Price','Kr','Enhetspris'])) || 0);
    const minStock = Math.max(0, Number(pickField(row, ['Min. beholdning','Min','Minimum','MinStock'])) || 0);
    state.items.push({id:uid(), name, produktnummer, category, qty, unit, minStock, pris});
    added++;
  });
  if(added > 0){
    checkLowStockNotifications();
    saveItems();
    showToast(added + (added===1 ? ' vare importert.' : ' varer importert.'));
  }else{
    showToast('Fant ingen gyldige varer i filen.', 'danger');
  }
  return added;
}
function findHeaderRowIndex(aoa){
  const nameCandidates = ['vare','navn','produkt','artikkel'];
  for(let i=0;i<aoa.length;i++){
    const row = aoa[i] || [];
    const hasNameHeader = row.some(cell => nameCandidates.includes(String(cell||'').trim().toLowerCase()));
    if(hasNameHeader) return i;
  }
  return -1;
}
function rowsFromAoa(aoa){
  const headerIdx = findHeaderRowIndex(aoa);
  if(headerIdx === -1) return [];
  const headers = aoa[headerIdx].map(h => String(h||'').trim());
  const dataRows = aoa.slice(headerIdx+1);
  return dataRows.map(r=>{
    const obj = {};
    headers.forEach((h,i)=>{ if(h) obj[h] = (r[i]!==undefined && r[i]!==null) ? r[i] : ''; });
    return obj;
  });
}
function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = ''; // slik at samme fil kan velges på nytt senere
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = rowsFromAoa(XLSX.utils.sheet_to_json(sheet, {header:1, defval:''}));
      importItemsFromRows(rows);
    }catch(err){
      console.error('import failed', err);
      showToast('Klarte ikke å lese filen. Sjekk at det er en gyldig Excel- eller CSV-fil.', 'danger');
    }
  };
  reader.readAsArrayBuffer(file);
}

    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-top:14px; cursor:pointer;">
      <input type="checkbox" ${state.acctRegenCode?'checked':''} onchange="state.acctRegenCode=this.checked;" />
      Lag ny gjenopprettingskode (ugyldiggjør den gamle)
    </label>
    ${state.acctMsg?`<p style="font-size:13px; color:${state.acctMsg==='Lagret.'?'var(--muted)':'var(--danger)'}; margin-top:8px;">${esc(state.acctMsg)}</p>`:''}
    <div class="savebar"><button class="secondarybtn" onclick="saveAccountSettings()">Lagre</button></div>

    <h3 style="font-size:16px; margin:30px 0 10px;">Ansatt-appens lenke</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:10px;">Brukes til å generere QR-kodene under «QR-koder». Fylles inn når appen er laget - la stå tom inntil videre.</p>
    <input type="text" placeholder="https://... (kommer senere)" value="${esc(state.appUrlDraft || s.appUrl || '')}"
      style="width:100%; max-width:420px; padding:10px 12px; border:1.5px solid var(--line); border-radius:3px; font-size:14px;"
      oninput="state.appUrlDraft=this.value;" />
    ${state.appUrlMsg?`<p style="font-size:13px; color:var(--muted); margin-top:6px;">${esc(state.appUrlMsg)}</p>`:''}
    <div class="savebar"><button class="secondarybtn" onclick="saveAppUrl()">Lagre lenke</button></div>

    <h3 style="font-size:16px; margin:30px 0 10px;">Demo-data</h3>
    ${state.confirmReset ? `
      <div class="confirmrow">
        Dette sletter alle varer og all logg, og setter inn eksempeldata på nytt. Sikker?
        <button class="smallbtn" onclick="resetDemoData()">Ja, nullstill</button>
        <button class="smallbtn" onclick="state.confirmReset=false; render();">Avbryt</button>
      </div>` : `
      <button class="dangerbtn" onclick="state.confirmReset=true; render();">Nullstill til eksempeldata</button>
    `}
  `;
}

function renderVarslinger(){
  const sorted = [...state.notifications].sort((a,b)=> b.ts.localeCompare(a.ts));
  const rows = sorted.map(n=>`
    <div class="notifrow ${n.seen?'':'unseen'}">
      <div class="notifmain"><strong>${esc(n.itemName)}</strong> er lav på lager - ${n.qty} igjen (grense: ${n.minStock})</div>
      <div class="notifmeta">${fmtDate(n.ts)}${n.seen?'':' · <span class="unseenTag">Ny</span>'}</div>
    </div>
  `).join('');
  return `
    <h1>Varslinger</h1>
    <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Du får et varsel her hver gang en vare når eller går under grensen du har satt for lav beholdning.</p>
    <div class="notiflist">${rows || '<p style="color:var(--muted);">Ingen varslinger ennå.</p>'}</div>
  `;
}

function renderDashboard(){
  let body;
  if(state.adminTab==='oversikt') body = renderOversikt();
  else if(state.adminTab==='varslinger') body = renderVarslinger();
  else if(state.adminTab==='nyvare') body = renderNyVare();
  else if(state.adminTab==='qr') body = renderQr();
  else if(state.adminTab==='logg') body = renderLogg();
  else body = renderInnstillinger();

  return `<div class="adminshell">
    ${renderAdminNav()}
    <div class="adminmain">${body}</div>
  </div>`;
}

/* ============ top-level render ============ */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="center-note"><div class="spinner"></div>Laster lagerdata …</div>`;
    return;
  }

  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.dataset && active.dataset.focusId && app.contains(active)){
    focusInfo = { id: active.dataset.focusId, start: active.selectionStart, end: active.selectionEnd };
  }

  let body;
  if(!state.settings) body = renderAdminSetup();
  else if(state.justRecoveryCode) body = renderRecoveryCodeDisplay();
  else if(!state.adminUnlocked) body = state.showRecovery ? renderRecoveryForm() : renderAdminLogin();
  else body = renderDashboard();

  app.innerHTML = `
    <div class="topbar">
      <span class="mark"></span>
      <span class="word">BRAVIDA</span>
      <span class="sub">LAGER</span>
    </div>
    ${state.toastMsg ? `<div class="toast ${state.toastType==='danger'?'danger':''}">${esc(state.toastMsg)}</div>` : ''}
    ${body}
  `;

  if(focusInfo){
    const el = app.querySelector('[data-focus-id="'+focusInfo.id+'"]');
    if(el){
      el.focus();
      if(typeof focusInfo.start === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

init();
</script>
</body>
</html>
