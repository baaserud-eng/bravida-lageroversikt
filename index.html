<style>

  table{width:100%; border-collapse:collapse; font-size:14px;}

  tr.lowrow{background:var(--danger-bg);}
  .rowbtns{display:flex; gap:6px;}
  .smallbtn{padding:5px 10px; font-size:12.5px; border:1px solid var(--line); background:var(--card); border-radius:3px; cursor:pointer;}

  .qrcard .cat{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .qrbox{display:flex; justify-content:center; align-items:center; min-height:150px;}
  .qrplaceholder{width:150px; height:150px; border:1.5px dashed var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; padding:10px; text-align:center;}

  .confirmrow{display:flex; align-items:center; gap:10px; font-size:13.5px; flex-wrap:wrap;}

  .notiflist{display:flex; flex-direction:column; border-top:1px solid var(--line);}

  @media print{

    .adminmain{padding:0; max-width:none;}

    .qrgrid{grid-template-columns:repeat(3,1fr);}
    .qrcard{break-inside:avoid; border:1px dashed #999;}

</style>

<body>
<div id="app"></div>

<script>
/* ============ storage helpers (Firebase Firestore - shared, real database) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA1is42oivHBlDrrUapyZwrztCUq0HwpC8",
  authDomain: "bravida-lager.firebaseapp.com",
  projectId: "bravida-lager",
  storageBucket: "bravida-lager.firebasestorage.app",
  messagingSenderId: "358302083961",
  appId: "1:358302083961:web:ab58c6e58c9a14ab611da8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const FIREBASE_COLLECTION = 'bravida-lager';

async function storageGet(key, shared){
  try{
    const snap = await db.collection(FIREBASE_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return (data && Object.prototype.hasOwnProperty.call(data, 'value')) ? data.value : null;
  }catch(e){ console.error('storage get failed', key, e); return null; }
}
async function storageSet(key, value, shared){
  try{
    await db.collection(FIREBASE_COLLECTION).doc(key).set({ value });
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

/* ============ state ============ */
const CATEGORIES = ['Elektro','Brannsikkerhet','Ventilasjon','Adgangskontroll','Innbruddsalarm','Kameraovervåkning','Nødlys'];

function categoryFieldHtml(pathExpr, current){
  const isCustom = !CATEGORIES.includes(current);
  if(isCustom){
    return `<input type="text" value="${esc(current)}" placeholder="Skriv inn kategori" data-focus-id="categoryCustom" oninput="${pathExpr}=this.value;" />
      <button type="button" onclick="${pathExpr}='${CATEGORIES[0]}'; render();" style="margin-top:4px; font-size:12px; background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; padding:0;">Velg fra liste</button>`;
  }
  return `<select onchange="if(this.value==='__custom__'){${pathExpr}=''; render();} else {${pathExpr}=this.value;}">
      ${CATEGORIES.map(c=>`<option value="${c}" ${current===c?'selected':''}>${c}</option>`).join('')}
      <option value="__custom__">Skriv inn selv...</option>
    </select>`;
}
const UNITS = ['stk','meter','pakke','liter'];

let state = {
  loaded:false,
  items:[],
  logs:[],
  notifications:[],
  settings:null, // holder bare appUrl osv.
  adminUsers:[], // katalog til visning: {email, createdAt} - selve pålogging styres av Firebase Auth
  currentUserEmail:null,
  adminUnlocked:false,
  setupEmail:'', setupPassword:'', setupPasswordConfirm:'', setupError:'',
  loginEmail:'', loginPassword:'', loginError:'', loginFailCount:0, loginLockedUntil:0,
  showRecovery:false, recoveryEmail:'', recoveryError:'', recoveryMsg:'',
  adminTab:'oversikt',
  editingId:null,
  editDraft:{},
  confirmDeleteId:null,
  confirmReset:false,
  logSearch:'',
  selectedAo:null,
  oversiktSearch:'',
  newItem:{ name:'', produktnummer:'', category:CATEGORIES[0], qty:0, unit:'stk', minStock:0, pris:0 },
  newItemError:'',
  acctEmail:'', acctCurrentPassword:'', acctNewPassword:'', acctNewPasswordConfirm:'', acctMsg:'',
  newAdminEmail:'', newAdminPassword:'', newAdminPasswordConfirm:'', newAdminMsg:'',
  confirmDeleteAdminId:null,
  appUrlDraft:'', appUrlMsg:'',
  employeeCode:'', employeeCodeDraft:'', employeeCodeMsg:'',
  toastMsg:null, toastType:'success'
};
let toastTimer = null;
function showToast(msg, type){
  state.toastMsg = msg;
  state.toastType = type || 'success';
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toastMsg = null; render(); }, 2500);
}

/* ============ low-stock notifications ============ */
let lowStockState = {}; // itemId -> was it low last time we checked (in-memory, per session)
function checkLowStockNotifications(silent){
  let changed = false;
  state.items.forEach(item=>{
    const low = isLow(item);
    const wasLow = lowStockState[item.id] === true;
    if(low && !wasLow && !silent){
      state.notifications.unshift({
        id: uid(), itemId: item.id, itemName: item.name,
        qty: item.qty, minStock: item.minStock,
        ts: new Date().toISOString(), seen: false
      });
      state.notifications = state.notifications.slice(0, 200);
      changed = true;
    }
    lowStockState[item.id] = low;
  });
  if(changed){ storageSet('notifications', state.notifications, true); }
}
async function markNotificationsSeen(){
  let changed = false;
  state.notifications.forEach(n=>{ if(!n.seen){ n.seen = true; changed = true; } });
  if(changed){ await storageSet('notifications', state.notifications, true); }
}

async function sha256Hex(str){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomCode(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = '';
  for(let i=0;i<len;i++){ out += chars[arr[i] % chars.length]; }
  return out;
}
function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function isRegisteredAdmin(email){
  return state.adminUsers.some(u => normEmail(u.email) === normEmail(email));
}
async function syncAdminEmails(){
  // Holder den enkle e-postlista (adminEmails) i Firestore oppdatert i takt med
  // den fulle kontorsjef-lista (adminUsers) - det er adminEmails de strenge
  // reglene faktisk sjekker mot.
  await storageSet('adminEmails', state.adminUsers.map(u=>normEmail(u.email)), true);
}

function uid(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
}
function seedItems(){
  return [
    {id:uid(), name:'Brannalarm', produktnummer:'', category:'Brannsikkerhet', qty:24, unit:'stk', minStock:5, pris:0},
    {id:uid(), name:'Røykvarsler', produktnummer:'', category:'Brannsikkerhet', qty:40, unit:'stk', minStock:10, pris:0},
    {id:uid(), name:'Sikring 16A', produktnummer:'', category:'Elektro', qty:150, unit:'stk', minStock:20, pris:0},
    {id:uid(), name:'Kabelrør 20mm', produktnummer:'', category:'Elektro', qty:80, unit:'meter', minStock:15, pris:0},
    {id:uid(), name:'PEX-rør 20mm', produktnummer:'', category:'Annet', qty:60, unit:'meter', minStock:10, pris:0},
    {id:uid(), name:'Termostat', produktnummer:'', category:'Ventilasjon', qty:18, unit:'stk', minStock:4, pris:0}
  ];
}

async function init(){
  let items = await storageGet('items', true);
  if(!items){ items = seedItems(); await storageSet('items', items, true); }
  let logs = await storageGet('logs', true);
  if(!logs){ logs = []; await storageSet('logs', logs, true); }
  let notifications = await storageGet('notifications', true);
  if(!notifications){ notifications = []; }
  let employeeCode = await storageGet('employeeCode', true);

  let settings = await storageGet('settings', true);
  let adminUsers = await storageGet('adminUsers', true);

  if(!adminUsers){
    if(settings && settings.passwordHash){
      // migrer den gamle én-konto-modellen inn i den nye kontorsjef-lista, slik at eksisterende innlogging fortsetter å virke
      adminUsers = [{
        id: uid(),
        email: settings.email,
        salt: settings.salt,
        passwordHash: settings.passwordHash,
        recoveryHash: settings.recoveryHash,
        createdAt: new Date().toISOString()
      }];
      // adminEmails må skrives FØR adminUsers/settings, siden Firestore-reglene krever
      // at man allerede står i adminEmails for å få lov til å skrive de to andre.
      await storageSet('adminEmails', [normEmail(settings.email)], true);
      settings = { appUrl: settings.appUrl || '' };
      await storageSet('adminUsers', adminUsers, true);
      await storageSet('settings', settings, true);
    }else{
      adminUsers = [];
    }
  }
  if(!settings) settings = { appUrl: '' };

  // Sikkerhetsmigrering: adminEmails er en enkel liste med bare e-postadresser (ingen passord-info),
  // som de strenge Firestore-reglene sjekker mot. Fylles automatisk ut fra kontorsjef-lista hvis den
  // ikke finnes fra før - trygt å kjøre hver gang, gjør ingenting hvis den allerede finnes.
  let adminEmails = await storageGet('adminEmails', true);
  if(!adminEmails && adminUsers.length > 0){
    adminEmails = adminUsers.map(u=>normEmail(u.email));
    await storageSet('adminEmails', adminEmails, true);
  }

  state.items = items; state.logs = logs; state.notifications = notifications;
  state.settings = settings; state.adminUsers = adminUsers; state.loaded = true;
  state.employeeCode = employeeCode || '';
  state.employeeCodeDraft = employeeCode || '';
  checkLowStockNotifications(true); // baseline stille - ikke varsle om ting som allerede var lavt før noen åpnet siden

  auth.onAuthStateChanged(async user=>{
    state.adminUnlocked = !!user;
    state.currentUserEmail = user ? user.email : null;
    if(user){
      // hent settings/adminUsers på nytt nå som vi er ekte innlogget, i tilfelle den aller første innlastingen
      // (før innlogging var bekreftet) ikke fikk lov til å lese dem under de nye reglene
      const freshSettings = await storageGet('settings', true);
      if(freshSettings) state.settings = freshSettings;
      const freshAdminUsers = await storageGet('adminUsers', true);
      if(freshAdminUsers) state.adminUsers = freshAdminUsers;

      // Sikkerhetssjekk: en Firebase-konto som er logget inn er IKKE det samme som
      // en registrert kontorsjef - hvem som helst kan i teorien opprette en konto
      // direkte mot Firebase (utenom denne siden). Hvis kontoen ikke står i
      // kontorsjef-lista, nekter vi tilgang til dashbordet og logger den ut igjen.
      // (Unntak: helt i starten, før noen kontorsjef er opprettet ennå.)
      if(state.adminUsers.length > 0 && !isRegisteredAdmin(user.email)){
        await auth.signOut();
        state.adminUnlocked = false;
        state.currentUserEmail = null;
        state.loginError = 'Denne kontoen er ikke registrert som kontorsjef på denne siden.';
        render();
        return;
      }
    }
    render();
  });

  render();
  startPolling();
}

function startPolling(){
  setInterval(async ()=>{
    if(document.visibilityState !== 'visible') return;
    if(!state.adminUnlocked) return;
    if(state.editingId) return; // ikke overskriv en pågående redigering
    const items = await storageGet('items', true);
    if(items){ state.items = items; checkLowStockNotifications(); }
    const logs = await storageGet('logs', true);
    if(logs){ state.logs = logs; }
    render();
  }, 15000);

  setInterval(()=>{
    if(!state.adminUnlocked && state.settings && state.loginLockedUntil && Date.now() < state.loginLockedUntil){
      render();
    }
  }, 1000);
}

/* ============ credentials ============ */
function firebaseErrorMessage(e){
  const code = e && e.code;
  const map = {
    'auth/email-already-in-use': 'Denne e-posten er allerede registrert.',
    'auth/invalid-email': 'Ugyldig e-postadresse.',
    'auth/weak-password': 'Passordet er for svakt (minst 6 tegn).',
    'auth/wrong-password': 'Feil e-post eller passord.',
    'auth/user-not-found': 'Feil e-post eller passord.',
    'auth/too-many-requests': 'For mange forsøk. Vent litt og prøv igjen.',
    'auth/requires-recent-login': 'Du må logge inn på nytt før du kan gjøre denne endringen.'
  };
  return map[code] || 'Noe gikk galt. Prøv igjen.';
}

async function submitSetup(){
  const email = normEmail(state.setupEmail);
  if(!email.includes('@') || email.length < 5){ state.setupError = 'Skriv inn en gyldig e-post.'; render(); return; }
  if(state.setupPassword.length < 6){ state.setupError = 'Passordet må være minst 6 tegn.'; render(); return; }
  if(state.setupPassword !== state.setupPasswordConfirm){ state.setupError = 'Passordene er ikke like.'; render(); return; }

  try{
    await auth.createUserWithEmailAndPassword(email, state.setupPassword);
    state.adminUsers = [{ email, createdAt: new Date().toISOString() }];
    if(!state.settings) state.settings = { appUrl: '' };
    // adminEmails må skrives FØR adminUsers/settings pga. Firestore-reglene
    await storageSet('adminEmails', [email], true);
    await storageSet('adminUsers', state.adminUsers, true);
    await storageSet('settings', state.settings, true);
    state.setupPassword=''; state.setupPasswordConfirm=''; state.setupError='';
    // adminUnlocked settes av onAuthStateChanged
    render();
  }catch(e){
    state.setupError = firebaseErrorMessage(e);
    render();
  }
}

function loginSuccess(){
  state.loginError=''; state.loginPassword=''; state.loginFailCount=0; state.loginLockedUntil=0;
  render();
}
function loginFailure(){
  state.loginFailCount = (state.loginFailCount||0) + 1;
  if(state.loginFailCount >= 5){
    state.loginLockedUntil = Date.now() + 30000;
    state.loginFailCount = 0;
    state.loginError = 'For mange feilforsøk. Prøv igjen om litt.';
  }else{
    state.loginError = 'Feil e-post eller passord.';
  }
  render();
}

async function submitLogin(){
  const now = Date.now();
  if(state.loginLockedUntil && now < state.loginLockedUntil){ render(); return; }
  const email = normEmail(state.loginEmail);

  try{
    await auth.signInWithEmailAndPassword(email, state.loginPassword);
    loginSuccess();
    return;
  }catch(e){
    if(e.code !== 'auth/user-not-found' && e.code !== 'auth/wrong-password'){
      state.loginError = firebaseErrorMessage(e); render(); return;
    }
  }

  // ikke funnet i Firebase Auth - sjekk om det er en konto fra før denne oppgraderingen (gammelt hash-system)
  const legacyUser = state.adminUsers.find(u => u.email===email && u.passwordHash);
  if(legacyUser){
    try{
      const attemptHash = await sha256Hex(legacyUser.salt + state.loginPassword);
      if(attemptHash === legacyUser.passwordHash){
        // riktig gammelt passord -> opprett en ekte Firebase-konto med samme passord, sømløst, og rens opp katalogen
        await auth.createUserWithEmailAndPassword(email, state.loginPassword);
        delete legacyUser.salt; delete legacyUser.passwordHash; delete legacyUser.recoveryHash;
        await storageSet('adminUsers', state.adminUsers, true);
        loginSuccess();
        return;
      }
    }catch(migrateErr){
      state.loginError = 'Kunne ikke fullføre kontooppgradering. Prøv igjen, eller ta kontakt.';
      render();
      return;
    }
  }

  loginFailure();
}

async function saveAccountSettings(){
  const user = auth.currentUser;
  if(!user){ state.acctMsg = 'Du er ikke lenger innlogget. Last siden på nytt.'; render(); return; }

  try{
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, state.acctCurrentPassword);
    await user.reauthenticateWithCredential(cred);
  }catch(e){
    state.acctMsg = 'Feil nåværende passord.'; render(); return;
  }

  const newEmail = normEmail(state.acctEmail) || user.email;
  if(!newEmail.includes('@')){ state.acctMsg = 'E-posten ser ikke gyldig ut.'; render(); return; }

  if(state.acctNewPassword){
    if(state.acctNewPassword.length < 6){ state.acctMsg = 'Nytt passord må være minst 6 tegn.'; render(); return; }
    if(state.acctNewPassword !== state.acctNewPasswordConfirm){ state.acctMsg = 'De nye passordene er ikke like.'; render(); return; }
  }

  try{
    const oldEmail = user.email;
    if(newEmail !== oldEmail){
      await user.updateEmail(newEmail);
      const dirEntry = state.adminUsers.find(u=>u.email===oldEmail);
      if(dirEntry) dirEntry.email = newEmail;
      await storageSet('adminUsers', state.adminUsers, true);
      await syncAdminEmails();
      state.currentUserEmail = newEmail;
    }
    if(state.acctNewPassword){
      await user.updatePassword(state.acctNewPassword);
    }
    state.acctCurrentPassword=''; state.acctNewPassword=''; state.acctNewPasswordConfirm='';
    state.acctEmail = newEmail;
    state.acctMsg = 'Lagret.';
  }catch(e){
    state.acctMsg = firebaseErrorMessage(e);
  }
  render();
}

async function addAdmin(){
  if(!auth.currentUser || (state.adminUsers.length > 0 && !isRegisteredAdmin(auth.currentUser.email))){
    state.newAdminMsg = 'Du må være innlogget som registrert kontorsjef for å gjøre dette.'; render(); return;
  }
  const email = normEmail(state.newAdminEmail);
  if(!email.includes('@') || email.length < 5){ state.newAdminMsg = 'Skriv inn en gyldig e-post.'; render(); return; }
  if(state.adminUsers.some(u=>u.email===email)){ state.newAdminMsg = 'Denne e-posten er allerede en kontorsjef.'; render(); return; }
  if(state.newAdminPassword.length < 6){ state.newAdminMsg = 'Passordet må være minst 6 tegn.'; render(); return; }
  if(state.newAdminPassword !== state.newAdminPasswordConfirm){ state.newAdminMsg = 'Passordene er ikke like.'; render(); return; }

  try{
    // bruk en sekundær Firebase-instans, slik at vi ikke logger oss selv ut når vi oppretter en ny bruker
    const secondaryApp = firebase.apps.find(a=>a.name==='Secondary') || firebase.initializeApp(firebaseConfig, 'Secondary');
    const secondaryAuth = secondaryApp.auth();
    await secondaryAuth.createUserWithEmailAndPassword(email, state.newAdminPassword);
    await secondaryAuth.signOut();

    state.adminUsers.push({ email, createdAt: new Date().toISOString() });

    state.newAdminEmail=''; state.newAdminPassword=''; state.newAdminPasswordConfirm=''; state.newAdminMsg='';

}

/* ============ helpers ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  try{
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    const datePart = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
    const timePart = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return `${datePart}${'&nbsp;'.repeat(6)}${timePart}`;
  }catch(e){ return iso; }
}
function isLow(item){ return item.qty <= item.minStock; }
function fmtKr(n){
  const num = Number(n)||0;
  return num.toLocaleString('nb-NO', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' kr';
}
function jsStr(s){
  // Brukes til å legge verdier inn i inline onclick-attributter. Må være trygg
  // BÅDE som JS-strengliteral OG som HTML-attributt - derfor kjøres esc() på
  // toppen, ellers kan f.eks. et anførselstegn i en AO-nummer- eller e-postverdi
  // bryte ut av attributten og kjøre vilkårlig HTML/JS (XSS).
  const jsLiteral = "'" + String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n') + "'";
  return esc(jsLiteral);
}
function shelfUrl(itemId){
  const base = (state.settings && state.settings.appUrl) ? state.settings.appUrl.trim() : '';
  return base ? (base + '#item=' + itemId) : '';
}

/* ============ Excel-import ============ */
function pickField(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const found = keys.find(k => k.trim().toLowerCase() === cand.toLowerCase());
    if(found !== undefined) return row[found];
  }
  return '';
}
function importItemsFromRows(rows){
  let added = 0;
  rows.forEach(row=>{
    const name = String(pickField(row, ['Vare','Navn','Produkt','Artikkel']) || '').trim();
    if(!name) return;
    const produktnummer = String(pickField(row, ['Produktnummer','Art.nr','Artnr','Varenummer','SKU']) || '').trim();
    const category = String(pickField(row, ['Kategori','Type']) || '').trim() || 'Annet';
    const qty = Math.max(0, Number(pickField(row, ['Antall','Beholdning','Lager','Qty'])) || 0);
    const unit = String(pickField(row, ['Enhet','Unit']) || '').trim() || 'stk';
    const pris = Math.max(0, Number(pickField(row, ['Pris','Price','Kr','Enhetspris'])) || 0);
    const minStock = Math.max(0, Number(pickField(row, ['Min. beholdning','Min','Minimum','MinStock'])) || 0);
    state.items.push({id:uid(), name, produktnummer, category, qty, unit, minStock, pris});
    added++;
  });
  if(added > 0){
    checkLowStockNotifications();
    saveItems();
    showToast(added + (added===1 ? ' vare importert.' : ' varer importert.'));
  }else{
    showToast('Fant ingen gyldige varer i filen.', 'danger');
  }
  return added;
}
function findHeaderRowIndex(aoa){
  const nameCandidates = ['vare','navn','produkt','artikkel'];
  for(let i=0;i<aoa.length;i++){
    const row = aoa[i] || [];
    const hasNameHeader = row.some(cell => nameCandidates.includes(String(cell||'').trim().toLowerCase()));
    if(hasNameHeader) return i;
  }
  return -1;
}
function rowsFromAoa(aoa){
  const headerIdx = findHeaderRowIndex(aoa);
  if(headerIdx === -1) return [];
  const headers = aoa[headerIdx].map(h => String(h||'').trim());
  const dataRows = aoa.slice(headerIdx+1);
  return dataRows.map(r=>{
    const obj = {};
    headers.forEach((h,i)=>{ if(h) obj[h] = (r[i]!==undefined && r[i]!==null) ? r[i] : ''; });
    return obj;
  });
}
function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = ''; // slik at samme fil kan velges på nytt senere
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = rowsFromAoa(XLSX.utils.sheet_to_json(sheet, {header:1, defval:''}));
      importItemsFromRows(rows);
    }catch(err){
      console.error('import failed', err);
      showToast('Klarte ikke å lese filen. Sjekk at det er en gyldig Excel- eller CSV-fil.', 'danger');
    }
  };
  reader.readAsArrayBuffer(file);
}

        <span class="num" style="font-size:24px; font-weight:700; color:var(--ink);">${fmtKr(totalValue)}</span>

      <tbody>${rows || `<tr><td colspan="8" style="color:var(--muted); padding:20px;">${state.items.length ? 'Ingen varer matcher søket.' : 'Ingen varer registrert ennå.'}</td></tr>`}</tbody>
    </table>
  `;
}

function renderNyVare(){

    <div class="formgrid">
      <div class="formfield"><label>Navn</label><input type="text" value="${esc(n.name)}" data-focus-id="newItemName" oninput="state.newItem.name=this.value;" placeholder="F.eks. Brannalarm" /></div>
      <div class="formfield"><label>Produktnummer</label><input type="text" value="${esc(n.produktnummer)}" data-focus-id="newItemProduktnummer" oninput="state.newItem.produktnummer=this.value;" placeholder="Valgfritt" /></div>
      <div class="formfield"><label>Kategori</label>
        ${categoryFieldHtml('state.newItem.category', n.category)}
      </div>
      <div class="formfield"><label>Antall på lager nå</label><input type="number" value="${n.qty}" data-focus-id="newItemQty" oninput="state.newItem.qty=this.value;" /></div>
      <div class="formfield"><label>Enhet</label>
        <select onchange="state.newItem.unit=this.value;">

      <div class="formfield"><label>Pris per enhet (kr)</label><input type="number" step="0.01" value="${n.pris}" data-focus-id="newItemPris" oninput="state.newItem.pris=this.value;" placeholder="0" /></div>
    </div>

  `;
}

function renderQr(){
  const base = state.settings.appUrl;
  const cards = state.items.map(i=>`
    <div class="qrcard">
      <div class="qrbox" id="qr-${i.id}">${base ? '' : '<div class="qrplaceholder">Venter på lenke til ansatt-appen</div>'}</div>
      <div class="name">${esc(i.name)}</div>
      <div class="cat">${esc(i.category)}</div>
      ${base ? '<button class="smallbtn noprint" onclick="window.print()">Skriv ut</button>' : ''}
    </div>
  `).join('');
  if(base){
    setTimeout(()=>{
      state.items.forEach(i=>{
        const el = document.getElementById('qr-'+i.id);
        if(el && window.QRCode){
          el.innerHTML='';
          new QRCode(el, {text: shelfUrl(i.id), width:150, height:150, colorDark:'#12192B', colorLight:'#ffffff'});
        }
      });
    }, 0);
  }
  return `
    <h1>QR-koder for hylle</h1>
    ${base
      ? `<p style="color:var(--muted); font-size:14px; margin-bottom:18px;">Skriv ut og heng ved riktig hylle. Skanning med telefonkamera åpner direkte til loggeskjemaet for varen.</p>
         <button class="secondarybtn noprint" style="margin-bottom:16px;" onclick="window.print()">Skriv ut alle</button>`
      : `<div class="noteband">QR-kodene kan ikke lages ennå - ansatt-appen er ikke bygget/lenket opp. Legg inn lenken under Innstillinger når den finnes, så genereres kodene automatisk.</div>`
    }
    <div class="qrgrid">${cards || '<p style="color:var(--muted);">Ingen varer ennå.</p>'}</div>
  `;
}

function renderAoKvittering(aoNummer){
  const entries = state.logs
    .filter(l => ((l.aoNummer && l.aoNummer.trim()) ? l.aoNummer.trim() : 'Ikke oppgitt') === aoNummer)
    .sort((a,b)=> a.ts.localeCompare(b.ts));
  const total = entries.reduce((sum,l)=> sum + (Number(l.pris)||0) * (Number(l.qty)||0), 0);

  const rows = entries.map(l=>{
    const unitPris = Number(l.pris)||0;
    const lineTotal = unitPris * (Number(l.qty)||0);
    return `<tr>
      <td>${fmtDate(l.ts)}</td>
      <td>${esc(l.itemName)}</td>
      <td>${esc(l.employee)}</td>
      <td class="num">${l.qty}</td>
      <td class="num">${fmtKr(unitPris)}</td>
      <td class="num">${fmtKr(lineTotal)}</td>
    </tr>`;
  }).join('');

  return `
    <button class="ghostbtn noprint" style="margin-bottom:18px;" onclick="state.selectedAo=null; render();">&larr; Tilbake til AO-oversikt</button>
    <div class="noprint" style="margin-bottom:18px;">
      <button class="secondarybtn" onclick="window.print()">🖨️ Skriv ut kvittering</button>
    </div>
    <h1>Kvittering - AO ${esc(aoNummer)}</h1>
    <p style="color:var(--muted); font-size:13px; margin-bottom:20px;">Bravida Lager</p>
    <table>
      <thead><tr><th>Tidspunkt</th><th>Vare</th><th>Ansatt</th><th>Antall</th><th>Pris/enhet</th><th>Sum</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="color:var(--muted); padding:20px;">Ingen uttak funnet.</td></tr>'}</tbody>
      <tfoot>
        <tr style="font-weight:700; border-top:2px solid var(--ink);">
          <td colspan="5" style="text-align:right; padding-top:12px;">Totalt:</td>
          <td class="num" style="padding-top:12px;">${fmtKr(total)}</td>
        </tr>
      </tfoot>
    </table>
  `;
}

function renderLogg(){
  if(state.selectedAo !== null){
    return renderAoKvittering(state.selectedAo);
  }

  const q = (state.logSearch || '').toLowerCase();

  const byAo = {};
  state.logs.forEach(l=>{
    const key = (l.aoNummer && l.aoNummer.trim()) ? l.aoNummer.trim() : 'Ikke oppgitt';
    if(!byAo[key]) byAo[key] = { totalQty:0, count:0, last:l.ts, totalCost:0, employees:new Set() };
    byAo[key].totalQty += l.qty;
    byAo[key].count += 1;
    byAo[key].totalCost += (Number(l.pris)||0) * (Number(l.qty)||0);
    if(l.ts > byAo[key].last) byAo[key].last = l.ts;
    const empName = (l.employee || '').trim();
    if(empName) byAo[key].employees.add(empName);
  });
  const aoSummaryRows = Object.entries(byAo)
    .filter(([ao]) => !q || ao.toLowerCase().includes(q))
    .sort((a,b)=> b[1].totalQty - a[1].totalQty)
    .map(([ao, s])=>`
      <tr style="cursor:pointer;" onclick="state.selectedAo=${jsStr(ao)}; render();">
        <td>${esc(ao)}</td><td class="num">${s.totalQty}</td><td class="num">${s.count}</td><td class="num">${fmtKr(s.totalCost)}</td><td>${esc(s.employees.size ? [...s.employees].join(', ') : '–')}</td><td>${fmtDate(s.last)}</td>
      </tr>
    `).join('');

  const hasAnyAo = state.logs.some(l=>l.aoNummer && l.aoNummer.trim());

  return `
    <h1>Uttakslogg</h1>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;">
      <input type="text" placeholder="Søk på AO-nummer..." value="${esc(state.logSearch||'')}" data-focus-id="logSearch"
        style="flex:1; min-width:200px; max-width:320px; padding:9px 12px; border:1.5px solid var(--line); border-radius:3px; font-size:14px;"
        oninput="state.logSearch=this.value; render();" />
      <button class="secondarybtn" onclick="exportLoggToExcel()">📥 Eksporter til Excel</button>
    </div>
    ${!hasAnyAo ? `<div class="noteband">AO-nummer vises her så snart ansatte begynner å oppgi det per uttak.</div>` : ''}

    <h3 style="font-size:16px; margin-bottom:10px;">Oversikt per AO-nummer</h3>
    <p style="color:var(--muted); font-size:12.5px; margin:-4px 0 12px;">Trykk på en rad for å se og skrive ut kvittering for den jobben.</p>
    <table>
      <thead><tr><th>AO-nummer</th><th>Antall tatt ut totalt</th><th>Antall uttak</th><th>Totalt kostnad</th><th>Ansatte</th><th>Siste uttak</th></tr></thead>
      <tbody>${aoSummaryRows || `<tr><td colspan="6" style="color:var(--muted); padding:20px;">${state.logs.length ? 'Ingen AO-numre matcher søket.' : 'Ingen uttak logget ennå.'}</td></tr>`}</tbody>
    </table>
  `;
}

      <div class="formfield"><label>E-post</label><input type="text" inputmode="email" value="${esc(state.acctEmail || me.email || '')}" data-focus-id="acctEmail" oninput="state.acctEmail=this.value;" /></div>

    </div>

    <div class="savebar" style="display:flex; gap:10px; align-items:center;">
      <button class="secondarybtn" onclick="saveAccountSettings()">Lagre</button>
      <button class="ghostbtn" onclick="signOutAdmin()">Logg ut</button>
    </div>

    <h3 style="font-size:16px; margin:30px 0 10px;">Kontorsjefer</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:12px;">Alle som kan logge inn på denne siden. Legg til nye, eller fjern noen som har sluttet.</p>
    <table style="max-width:560px; margin-bottom:8px;">
      <thead><tr><th>E-post</th><th></th></tr></thead>
      <tbody>
        ${state.adminUsers.map(u=>{
          if(state.confirmDeleteAdminId === u.email){

          </tr>`;

    </table>
    <p style="color:var(--muted); font-size:12px; margin-bottom:16px;">«Slett» fjerner personen fra denne lista. For å faktisk sperre innloggingen deres helt, må du også slette brukeren under <a href="https://console.firebase.google.com/project/${esc(firebaseConfig.projectId)}/authentication/users" target="_blank" rel="noopener" style="color:var(--ink);">Firebase Console → Authentication</a>.</p>

    <div class="formgrid">
      <div class="formfield"><label>Ny kontorsjef - e-post</label><input type="text" inputmode="email" value="${esc(state.newAdminEmail)}" data-focus-id="newAdminEmail" oninput="state.newAdminEmail=this.value;" /></div>
      <div class="formfield"><label>Passord (minst 6 tegn)</label><input type="password" value="${esc(state.newAdminPassword)}" data-focus-id="newAdminPassword" oninput="state.newAdminPassword=this.value;" /></div>
      <div class="formfield"><label>Bekreft passord</label><input type="password" value="${esc(state.newAdminPasswordConfirm)}" data-focus-id="newAdminPasswordConfirm" oninput="state.newAdminPasswordConfirm=this.value;" /></div>
    </div>

    <p style="color:var(--muted); font-size:13px; margin-bottom:10px;">Brukes til å generere QR-kodene under «QR-koder». Fylles inn når appen er laget - la stå tom inntil videre.</p>
    <input type="text" placeholder="https://... (kommer senere)" value="${esc(state.appUrlDraft || s.appUrl || '')}"

      data-focus-id="appUrlDraft" oninput="state.appUrlDraft=this.value;" />

    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="F.eks. 48213" value="${esc(state.employeeCodeDraft)}"

        <button class="smallbtn" onclick="resetDemoData()">Ja, nullstill</button>
        <button class="smallbtn" onclick="state.confirmReset=false; render();">Avbryt</button>

function renderVarslinger(){
  const sorted = [...state.notifications].sort((a,b)=> b.ts.localeCompare(a.ts));
  const rows = sorted.map(n=>`
    <div class="notifrow ${n.seen?'':'unseen'}">
      <div class="notifmain"><strong>${esc(n.itemName)}</strong> er lav på lager - ${n.qty} igjen (grense: ${n.minStock})</div>
      <div class="notifmeta">${fmtDate(n.ts)}${n.seen?'':' · <span class="unseenTag">Ny</span>'}</div>
    </div>
  `).join('');
  return `
    <h1>Varslinger</h1>
    <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Du får et varsel her hver gang en vare når eller går under grensen du har satt for lav beholdning.</p>
    <div class="notiflist">${rows || '<p style="color:var(--muted);">Ingen varslinger ennå.</p>'}</div>
  `;
}

function renderDashboard(){
  let body;
  if(state.adminTab==='oversikt') body = renderOversikt();
  else if(state.adminTab==='varslinger') body = renderVarslinger();
  else if(state.adminTab==='nyvare') body = renderNyVare();
  else if(state.adminTab==='qr') body = renderQr();
  else if(state.adminTab==='logg') body = renderLogg();
  else body = renderInnstillinger();

  return `<div class="adminshell">
    ${renderAdminNav()}
    <div class="adminmain">${body}</div>
  </div>`;
}

/* ============ top-level render ============ */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="center-note"><div class="spinner"></div>Laster lagerdata …</div>`;
    return;
  }

  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.dataset && active.dataset.focusId && app.contains(active)){
    focusInfo = { id: active.dataset.focusId };
    try{ focusInfo.start = active.selectionStart; focusInfo.end = active.selectionEnd; }catch(e){ /* denne input-typen (f.eks. number) støtter ikke tekstmarkering */ }
  }

  let body;
  if(state.adminUsers.length === 0) body = renderAdminSetup();
  else if(!state.adminUnlocked) body = state.showRecovery ? renderRecoveryForm() : renderAdminLogin();
  else body = renderDashboard();

  app.innerHTML = `
    <div class="topbar">
      <span class="mark"></span>
      <span class="word">BRAVIDA</span>
      <span class="sub">LAGER</span>
    </div>
    ${state.toastMsg ? `<div class="toast ${state.toastType==='danger'?'danger':''}">${esc(state.toastMsg)}</div>` : ''}
    ${body}
  `;

  const topbarEl = app.querySelector('.topbar');
  if(topbarEl){
    document.documentElement.style.setProperty('--topbar-h', topbarEl.offsetHeight + 'px');
  }

  if(focusInfo){
    const el = app.querySelector('[data-focus-id="'+focusInfo.id+'"]');
    if(el){
      el.focus();
      if(typeof focusInfo.start === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

window.addEventListener('resize', ()=>{
  const topbarEl = document.querySelector('.topbar');
  if(topbarEl) document.documentElement.style.setProperty('--topbar-h', topbarEl.offsetHeight + 'px');
});

init();
</script>
