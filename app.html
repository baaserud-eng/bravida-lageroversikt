<style>
  :root{
    --ink:#12192B;
    --paper:#EDEFEE;
    --card:#FFFFFF;
    --accent:#F0A202;
    --accent-ink:#4A3300;
    --danger:#C1272D;
    --line:#D4D7D2;
    --muted:#5B6169;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  #app{min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    background:var(--ink); color:#fff;
    padding:14px 18px; display:flex; align-items:baseline; gap:8px;
    position:sticky; top:0; z-index:20;
  }
  .topbar .mark{ width:10px; height:10px; background:var(--accent); display:inline-block; border-radius:1px; }
  .topbar .word{font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; letter-spacing:0.02em;}
  .topbar .sub{font-size:12px; color:#B9BFCC; font-family:'IBM Plex Mono',monospace;}

  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 60px; width:100%; flex:1;}

  .center-note{max-width:420px; margin:60px auto; text-align:center; color:var(--muted);}
  .spinner{width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .searchrow{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .searchrow input[type=text]{
    flex:1; min-width:160px; padding:12px 14px; border:1.5px solid var(--line); border-radius:3px;
    font-size:15px; background:var(--card); color:var(--ink);
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .chip{
    padding:6px 13px; border-radius:20px; border:1.5px solid var(--line); background:var(--card);
    font-size:13px; cursor:pointer; color:var(--muted); white-space:nowrap;
  }
  .chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  .itemgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
  .tag{
    background:var(--card); border:1.5px solid var(--line); border-radius:2px; padding:14px 16px;
    cursor:pointer; text-align:left; width:100%; position:relative; overflow:hidden;
  }
  .tag::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line); }
  .tag.low::before{background:var(--danger);}
  .tag:hover{border-color:#9aa;}
  .tag .name{font-size:17px; font-weight:600; margin-bottom:2px;}
  .tag .meta{font-size:12.5px; color:var(--muted);}
  .tag .qty{font-size:26px; font-weight:600; margin-top:8px;}
  .tag .qty small{font-size:13px; color:var(--muted); font-weight:400; margin-left:3px;}
  .tag .lowflag{display:inline-block; margin-top:6px; font-size:11.5px; color:var(--danger); font-weight:600;}

  .emptystate{text-align:center; padding:50px 20px; color:var(--muted);}

  .backlink{display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0 0 18px;}
  .detailcard{background:var(--card); border:1.5px solid var(--line); border-radius:2px; padding:26px;}
  .detailcard h2{font-size:30px; margin-bottom:4px;}
  .detailcard .catline{color:var(--muted); font-size:14px; margin-bottom:18px;}
  .stockline{display:flex; align-items:baseline; gap:8px; margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line);}
  .stockline .big{font-size:40px; font-weight:600;}
  .stockline .lbl{color:var(--muted); font-size:14px;}

  .fieldlabel{font-size:13px; color:var(--muted); margin-bottom:6px; display:block;}
  .stepper{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .stepbtn{
    width:48px; height:48px; border-radius:50%; border:1.5px solid var(--ink); background:var(--card);
    font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .stepbtn:active{background:var(--ink); color:#fff;}
  .stepbtn:disabled{opacity:0.4; cursor:not-allowed;}
  .stepinput{
    width:90px; text-align:center; font-size:26px; padding:10px 4px; border:1.5px solid var(--line);
    border-radius:3px; font-family:'IBM Plex Mono',monospace;
  }
  .nameinput{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:3px; font-size:16px; margin-bottom:18px;
  }
  .fieldhint{font-size:12px; color:var(--muted); margin-top:-14px; margin-bottom:18px;}
  .primarybtn{
    width:100%; padding:15px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:3px;
    font-size:16px; font-weight:600; cursor:pointer;
  }
  .primarybtn:disabled{opacity:0.5; cursor:not-allowed;}
  .secondarybtn{padding:10px 16px; background:none; border:1.5px solid var(--line); border-radius:3px; cursor:pointer; font-size:14px;}

  .confirmbox{text-align:center; padding:20px 0;}
  .checkmark{
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;
    animation:pop 0.35s ease;
  }
  @keyframes pop{from{transform:scale(0.4); opacity:0;} to{transform:scale(1); opacity:1;}}

  .scanbtn{
    width:100%; padding:14px; background:var(--ink); color:#fff; border:none; border-radius:3px;
    font-size:15px; font-weight:600; cursor:pointer; margin-bottom:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #scanner-overlay{
    display:none; position:fixed; inset:0; background:#000; z-index:100;
    flex-direction:column;
  }
  .scanner-wrap{ display:flex; flex-direction:column; height:100%; }
  .scanner-top{
    display:flex; align-items:center; justify-content:space-between; padding:16px;
    color:#fff; font-family:'Barlow Condensed',sans-serif; font-size:18px;
  }
  .scanner-close{
    background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:3px;
    padding:8px 14px; font-size:14px; cursor:pointer;
  }
  #scanner-video{ flex:1; width:100%; object-fit:cover; background:#000; }
  .scanner-msg{ color:#fff; text-align:center; padding:20px; font-size:14px; }
</style>
</head>

<div id="app"></div>
<div id="scanner-overlay"></div>

<script>

  projectId: "bravida-lager",

  appId: "1:358302083961:web:ab58c6e58c9a14ab611da8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FIREBASE_COLLECTION = 'bravida-lager';

async function storageGet(key, shared){
  try{
    const snap = await db.collection(FIREBASE_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return (data && Object.prototype.hasOwnProperty.call(data, 'value')) ? data.value : null;
  }catch(e){ console.error('storage get failed', key, e); return null; }
}
async function storageSet(key, value, shared){
  try{
    await db.collection(FIREBASE_COLLECTION).doc(key).set({ value });
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

/* ============ state ============ */
const CATEGORIES = ['Elektro','Brannsikkerhet','Ventilasjon','Adgangskontroll','Innbruddsalarm','Kameraovervåkning','Nødlys','Annet'];

let state = {
  loaded:false,
  items:[],
  route: location.hash || '#',
  search:'',
  catFilter:'Alle',
  qtyDraft:1,
  nameDraft:'',
  aoDraft:'',
  justLogged:null
};

function uid(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
}
function seedItems(){
  return [
    {id:uid(), name:'Brannalarm', category:'Brannsikkerhet', qty:24, unit:'stk', minStock:5},
    {id:uid(), name:'Røykvarsler', category:'Brannsikkerhet', qty:40, unit:'stk', minStock:10},
    {id:uid(), name:'Sikring 16A', category:'Elektro', qty:150, unit:'stk', minStock:20},
    {id:uid(), name:'Kabelrør 20mm', category:'Elektro', qty:80, unit:'meter', minStock:15},
    {id:uid(), name:'PEX-rør 20mm', category:'Annet', qty:60, unit:'meter', minStock:10},
    {id:uid(), name:'Termostat', category:'Ventilasjon', qty:18, unit:'stk', minStock:4}
  ];
}

async function init(){
  let items = await storageGet('items', true);
  if(!items){ items = seedItems(); await storageSet('items', items, true); }
  state.items = items; state.loaded = true;
  render();
  startPolling();
}

function startPolling(){
  setInterval(async ()=>{
    if(document.visibilityState !== 'visible') return;
    const items = await storageGet('items', true);
    if(items){ state.items = items; render(); }
  }, 20000);
}

window.addEventListener('hashchange', ()=>{
  state.route = location.hash || '#';
  state.justLogged = null;
  state.qtyDraft = 1; state.nameDraft=''; state.aoDraft='';
  render();
});

/* ============ QR scanner ============ */
let scannerStream = null;
let scannerRAF = null;

async function openScanner(){
  const overlay = document.getElementById('scanner-overlay');
  overlay.innerHTML = `
    <div class="scanner-wrap">
      <div class="scanner-top">
        <span>Skann QR-kode</span>
        <button class="scanner-close" id="scanner-close-btn">Lukk ✕</button>
      </div>
      <video id="scanner-video" playsinline autoplay muted></video>
      <div id="scanner-msg" class="scanner-msg"></div>
    </div>
  `;
  overlay.style.display = 'flex';
  document.getElementById('scanner-close-btn').onclick = closeScanner;

  const video = document.getElementById('scanner-video');
  const msgEl = document.getElementById('scanner-msg');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msgEl.textContent = 'Kameratilgang støttes ikke i denne nettleseren. Bruk telefonens vanlige kamera-app på QR-koden i stedet.';
    return;
  }

  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    msgEl.textContent = 'Fikk ikke tilgang til kameraet. Sjekk at du har gitt tillatelse i nettleseren, eller bruk telefonens vanlige kamera-app på QR-koden i stedet.';
    return;
  }

  video.srcObject = scannerStream;
  try{ await video.play(); }catch(e){}

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function tick(){
    if(!scannerStream) return; // scanneren er lukket
    if(video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        handleScanResult(code.data);
        return;
      }
    }
    scannerRAF = requestAnimationFrame(tick);
  }
  scannerRAF = requestAnimationFrame(tick);
}

function handleScanResult(text){
  closeScanner();
  try{
    const url = new URL(text, location.href);
    if(url.hash && url.hash.indexOf('#item=') === 0){
      location.hash = url.hash;
    }
  }catch(e){ /* ikke en gyldig lenke, ignorer */ }
}

function closeScanner(){
  if(scannerRAF){ cancelAnimationFrame(scannerRAF); scannerRAF = null; }
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
  const overlay = document.getElementById('scanner-overlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

/* ============ mutations ============ */
async function refreshItems(){
  const items = await storageGet('items', true);
  if(items){ state.items = items; }
  render();
}

async function logWithdrawal(itemId, qty, employee, aoNummer){
  const freshItems = await storageGet('items', true);
  const items = freshItems || state.items;
  const item = items.find(i=>i.id===itemId);
  if(!item){ state.items = items; render(); return; }

  qty = Math.max(1, Math.min(qty, item.qty > 0 ? item.qty : qty));
  item.qty = Math.max(0, item.qty - qty);
  state.items = items;
  await storageSet('items', items, true);

  const freshLogs = (await storageGet('logs', true)) || [];
  const entry = {
    id: uid(), itemId, itemName: item.name, qty,
    employee: (employee||'').trim() || 'Ukjent',
    aoNummer: (aoNummer||'').trim(),
    pris: (typeof item.pris === 'number' ? item.pris : 0),
    remainingAfter: item.qty,
    ts: new Date().toISOString()
  };
  freshLogs.unshift(entry);
  await storageSet('logs', freshLogs.slice(0, 500), true);

  state.justLogged = {itemId: item.id, name:item.name, qty, remaining:item.qty};
  render();
}

/* ============ helpers ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isLow(item){ return item.qty <= item.minStock; }

/* ============ render: home ============ */
function renderHome(){
  const q = state.search.toLowerCase();
  let items = state.items.filter(i=>{
    const matchesQ = !q || i.name.toLowerCase().includes(q);
    const matchesCat = state.catFilter==='Alle' || i.category===state.catFilter;
    return matchesQ && matchesCat;
  });
  const chips = ['Alle', ...CATEGORIES].map(c=>
    `<button class="chip ${state.catFilter===c?'active':''}" onclick="state.catFilter='${esc(c)}'; render();">${esc(c)}</button>`
  ).join('');

  const grid = items.length ? `<div class="itemgrid">${items.map(i=>`
      <button class="tag ${isLow(i)?'low':''}" onclick="location.hash='#item='+'${i.id}'">
        <div class="name">${esc(i.name)}</div>
        <div class="meta">${esc(i.category)}</div>
        <div class="qty">${i.qty}<small>${esc(i.unit)}</small></div>
        ${isLow(i) ? '<div class="lowflag">Lav beholdning</div>' : ''}
      </button>
    `).join('')}</div>`
    : `<div class="emptystate">Fant ingen varer${q?` for "${esc(state.search)}"`:''}.</div>`;

  return `
    <div class="wrap">
      <button class="scanbtn" onclick="openScanner()">📷 Skann QR-kode</button>
      <div class="searchrow">
        <input type="text" placeholder="Søk etter vare..." value="${esc(state.search)}" data-focus-id="search" oninput="state.search=this.value; render();" />
        <button class="secondarybtn" onclick="refreshItems()">Oppdater</button>
      </div>
      <div class="chips">${chips}</div>
      ${grid}
    </div>
  `;
}

/* ============ render: item detail / log screen ============ */
function renderItemDetail(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if(!item){
    return `<div class="wrap"><div class="emptystate">Fant ikke varen. Kanskje den er slettet.<br><br>
      <button class="secondarybtn" onclick="location.hash='#'">Til oversikten</button></div></div>`;
  }
  if(state.justLogged && state.justLogged.itemId === item.id){
    const jl = state.justLogged;
    return `<div class="wrap">
      <div class="detailcard confirmbox">
        <div class="checkmark">✓</div>
        <h2>Logget!</h2>
        <p style="color:var(--muted); margin:10px 0 4px;">${jl.qty} ${esc(item.unit)} ${esc(jl.name)} tatt ut.</p>
        <p class="num" style="font-size:14px; color:var(--muted);">${jl.remaining} ${esc(item.unit)} igjen på lager</p>
        <div style="margin-top:22px; display:flex; gap:10px; justify-content:center;">
          <button class="secondarybtn" onclick="state.justLogged=null; render();">Logg mer av denne</button>
          <button class="primarybtn" style="width:auto; padding:10px 18px;" onclick="location.hash='#'">Til oversikten</button>
        </div>
      </div>
    </div>`;
  }

  const max = item.qty;
  const ready = max>0 && state.nameDraft.trim() && state.aoDraft.trim();
  return `<div class="wrap">
    <button class="backlink" onclick="location.hash='#'">&larr; Tilbake</button>
    <div class="detailcard">
      <h2>${esc(item.name)}</h2>
      <div class="catline">${esc(item.category)}</div>
      <div class="stockline">
        <div class="big num">${item.qty}</div>
        <div class="lbl">${esc(item.unit)} på lager${isLow(item)?' · <span style="color:var(--danger); font-weight:600;">lav beholdning</span>':''}</div>
      </div>

      <span class="fieldlabel">Antall du tar ut</span>
      <div class="stepper">
        <button class="stepbtn" ${max===0?'disabled':''} onclick="state.qtyDraft=Math.max(1,state.qtyDraft-1); render();">−</button>
        <input class="stepinput num" type="number" min="1" max="${max}" value="${state.qtyDraft}" ${max===0?'disabled':''}
          data-focus-id="qtyDraft"
          oninput="state.qtyDraft=Math.max(1,Math.min(${max||9999},parseInt(this.value)||1)); render();" />
        <button class="stepbtn" ${max===0?'disabled':''} onclick="state.qtyDraft=Math.min(${max||1},state.qtyDraft+1); render();">+</button>
      </div>

      <span class="fieldlabel">AO-nummer</span>
      <input class="nameinput" type="text" inputmode="numeric" placeholder="F.eks. 22732680016" value="${esc(state.aoDraft)}"
        data-focus-id="aoDraft" oninput="state.aoDraft=this.value;" />

      <span class="fieldlabel">Ditt navn / initialer</span>
      <input class="nameinput" type="text" placeholder="F.eks. Ola H." value="${esc(state.nameDraft)}"
        data-focus-id="nameDraft" oninput="state.nameDraft=this.value;" />

      <button class="primarybtn" ${!ready?'disabled':''}
        onclick="logWithdrawal('${item.id}', state.qtyDraft, state.nameDraft, state.aoDraft)">
        Logg uttak av ${state.qtyDraft} ${esc(item.unit)}
      </button>
      ${max===0?'<p style="color:var(--danger); font-size:13px; margin-top:10px;">Tomt på lager — meld fra til kontorsjef.</p>':''}
      ${max>0 && !ready ? '<p style="color:var(--muted); font-size:13px; margin-top:10px;">Fyll ut AO-nummer og navn for å kunne logge uttaket.</p>' : ''}
    </div>
  </div>`;
}

/* ============ top-level render ============ */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="center-note"><div class="spinner"></div>Laster lagerdata …</div>`;
    return;
  }

  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.dataset && active.dataset.focusId && app.contains(active)){
    focusInfo = { id: active.dataset.focusId, start: active.selectionStart, end: active.selectionEnd };
  }

  const route = state.route;
  const body = route.startsWith('#item=')
    ? renderItemDetail(route.slice('#item='.length))
    : renderHome();

  app.innerHTML = `
    <div class="topbar">
      <span class="mark"></span>
      <span class="word">BRAVIDA</span>
      <span class="sub">LAGER</span>
    </div>
    ${body}
  `;

  if(focusInfo){
    const el = app.querySelector('[data-focus-id="'+focusInfo.id+'"]');
    if(el){
      el.focus();
      if(typeof focusInfo.start === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

init();

if('serviceWorker' in navigator){
  try{
    const swSrc = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',function(){});";
    const swBlob = new Blob([swSrc], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }catch(e){ /* not critical - app works fully without it */ }
}
</script>
